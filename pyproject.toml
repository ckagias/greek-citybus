[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "greek-citybus"
version = "0.1.0"
description = "Unofficial Python client for live bus arrival/departure times across ~29 Greek cities on the citybus.gr platform"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "Christoforos Kagias" }]
keywords = ["greece", "citybus", "bus", "transit", "scraper", "patras", "ioannina", "volos"]
classifiers = [
    "Programming Language :: Python :: 3",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
]
dependencies = [
    "requests>=2.31",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "responses>=0.25",
]
web = [
    "fastapi>=0.110",
    "uvicorn[standard]>=0.29",
]

[project.scripts]
greek-citybus = "greek_citybus.cli:main"

[project.urls]
Homepage = "https://github.com/ckagias/greek-citybus"

[tool.hatch.build.targets.wheel]
packages = ["src/greek_citybus"]
